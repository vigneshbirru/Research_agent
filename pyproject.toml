[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vighneshbirru", email = "vignesh23birrugmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.18",
    "langgraph-cli[inmem]>=0.4.40",
]

[project.scripts]
research-agent = "research_agent:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
